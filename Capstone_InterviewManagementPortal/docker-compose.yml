services:
  db:
    image: mongo:latest
    container_name: interview-portal-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: interview-portal-keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-mem
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview-portal-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://db:27017
      - DB_NAME=Interview_Management_Portal
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=interview-portal
    depends_on:
      - db
      - keycloak

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interview-portal-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
